basePath: /api/v1
definitions:
  http.AssignRoleRequest:
    properties:
      role:
        enum:
        - user
        - manager
        type: string
    required:
    - role
    type: object
  http.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        minLength: 8
        type: string
      user_id:
        type: string
    required:
    - new_password
    - old_password
    - user_id
    type: object
  http.CreateForeignCompanyRequest:
    properties:
      address:
        type: string
      country_code:
        type: string
      full_name:
        type: string
      pin:
        type: string
    required:
    - country_code
    - full_name
    - pin
    type: object
  http.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  http.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  http.LogoutRequest:
    properties:
      revoke_all_sessions:
        type: boolean
    type: object
  http.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  http.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  http.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      reset_token:
        type: string
    required:
    - new_password
    - reset_token
    type: object
  http.UpdateForeignCompanyRequest:
    properties:
      address:
        type: string
      country_code:
        type: string
      full_name:
        type: string
      pin:
        type: string
    required:
    - country_code
    - full_name
    - pin
    type: object
  http.UpdateProfileRequest:
    properties:
      first_name:
        maxLength: 100
        minLength: 1
        type: string
      last_name:
        maxLength: 100
        minLength: 1
        type: string
      user_id:
        type: string
    required:
    - user_id
    type: object
  models.APIError:
    properties:
      code:
        type: string
      details:
        type: string
      message:
        type: string
    type: object
  models.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/models.APIError'
      meta:
        $ref: '#/definitions/models.MetaData'
      success:
        type: boolean
    type: object
  models.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      timestamp:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.BankAccount:
    properties:
      account_number:
        type: string
      bank_code:
        type: string
      bank_name:
        type: string
      created_at:
        type: integer
      currency:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      owner_id:
        type: string
      updated_at:
        type: integer
    type: object
  models.Catalog:
    properties:
      category:
        type: string
      created_at:
        type: integer
      currency:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: number
      unit:
        type: string
      updated_at:
        type: integer
    type: object
  models.Company:
    properties:
      created_at:
        type: integer
      description:
        type: string
      id:
        type: string
      member_count:
        type: integer
      name:
        type: string
      owner_id:
        type: string
      status:
        type: string
      updated_at:
        type: integer
    type: object
  models.Document:
    properties:
      assigned_to:
        type: string
      content:
        type: string
      created_at:
        type: integer
      created_by:
        type: string
      entries:
        items:
          $ref: '#/definitions/models.DocumentEntry'
        type: array
      id:
        type: string
      organization_id:
        type: string
      status:
        type: string
      status_changed_at:
        type: integer
      title:
        type: string
      updated_at:
        type: integer
      version:
        type: integer
    type: object
  models.DocumentEntry:
    properties:
      created_at:
        type: integer
      document_id:
        type: string
      id:
        type: string
      key:
        type: string
      updated_at:
        type: integer
      value:
        type: string
    type: object
  models.DocumentListResponse:
    properties:
      documents:
        items:
          $ref: '#/definitions/models.Document'
        type: array
      page_info:
        $ref: '#/definitions/models.PageInfo'
    type: object
  models.ForeignCompany:
    properties:
      address:
        type: string
      country_code:
        type: string
      created_at:
        type: integer
      full_name:
        type: string
      id:
        type: integer
      pin:
        type: string
      updated_at:
        type: integer
    type: object
  models.Invoice:
    properties:
      created_at:
        type: integer
      delivery_date:
        type: string
      id:
        type: string
      invoice_date:
        type: string
      invoice_number:
        type: string
      is_resident:
        type: boolean
      note:
        type: string
      status:
        type: string
      total_amount:
        type: number
      updated_at:
        type: integer
    type: object
  models.ListUsersResponse:
    properties:
      page_info:
        $ref: '#/definitions/models.PageInfo'
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  models.MetaData:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  models.PageInfo:
    properties:
      page:
        type: integer
      size:
        type: integer
      total_count:
        type: integer
    type: object
  models.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      timestamp:
        type: integer
      token_type:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: integer
      email:
        type: string
      first_name:
        type: string
      is_active:
        type: boolean
      last_name:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: integer
      user_id:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@kkm-project.com
    name: API Support
    url: http://www.swagger.io/support
  description: Microservices API Gateway with command and query services. Supports
    CQRS pattern with separate command and query endpoints.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: KKM API Gateway
  version: "1.0"
paths:
  /api/v1/foreign-companies/{id}:
    delete:
      parameters:
      - description: Foreign Company ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Foreign company deleted successfully
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Удаление иностранной компании
      tags:
      - foreign-companies
    put:
      consumes:
      - application/json
      parameters:
      - description: Foreign Company ID
        in: path
        name: id
        required: true
        type: integer
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.UpdateForeignCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.ForeignCompany'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Обновление иностранной компании
      tags:
      - foreign-companies
