    delete:
      parameters:
        - description: Foreign Company ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Foreign company deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "400":
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
      security:
        - BearerAuth: []
      summary: Удаление иностранной компании
      tags:
        - foreign-companies
    put:
      parameters:
        - description: Foreign Company ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/http.UpdateForeignCompanyRequest"
        description: Данные для обновления
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/models.APIResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/models.ForeignCompany"
                    type: object
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
      security:
        - BearerAuth: []
      summary: Обновление иностранной компании
      tags:
        - foreign-companies
