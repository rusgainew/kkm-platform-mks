                $ref: "#/components/schemas/models.APIResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
      security:
        - BearerAuth: []
      summary: Change password
      tags:
        - Users
  /users/profile:
    put:
      description: Update first_name and/or last_name
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/http.UpdateProfileRequest"
        description: Profile fields
        required: true
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
      security:
        - BearerAuth: []
      summary: Update user profile
      tags:
        - Users
  /users/refresh:
    post:
      description: Refresh access and refresh tokens using refresh_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/http.RefreshTokenRequest"
        description: Refresh token payload
        required: true
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.TokenResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
      summary: Refresh tokens
      tags:
        - Users
  /users/register:
    post:
      description: Register a new user account. Returns access and refresh tokens.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/http.RegisterRequest"
        description: Registration data with email, password (min 8 chars), first_name
          and last_name
        required: true
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.AuthResponse"
        "400":
          description: Invalid input - validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
      summary: User registration
      tags:
        - Users
  /users/reset-password:
    post:
      description: Reset password using reset token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/http.ResetPasswordRequest"
        description: Reset payload
        required: true
      responses:
        "200":
          description: New tokens and user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "401":
          description: Token expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.APIResponse"
      summary: Reset password
      tags:
        - Users
servers:
  - url: http://localhost:8080/api/v1
  - url: https://localhost:8080/api/v1
components:
  requestBodies:
    models.Document:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/models.Document"
      description: Document payload
      required: true
  securitySchemes:
    BearerAuth:
      description: Type "Bearer" followed by a space and JWT token.
      in: header
      name: Authorization
      type: apiKey
  schemas:
    http.AssignRoleRequest:
      properties:
        role:
          enum:
            - user
            - manager
          type: string
      required:
        - role
      type: object
    http.ChangePasswordRequest:
      properties:
        new_password:
          minLength: 8
          type: string
        old_password:
          minLength: 8
          type: string
        user_id:
          type: string
      required:
        - new_password
        - old_password
        - user_id
      type: object
    http.CreateForeignCompanyRequest:
      properties:
        address:
          type: string
        country_code:
          type: string
        full_name:
          type: string
        pin:
          type: string
      required:
        - country_code
        - full_name
        - pin
      type: object
    http.ForgotPasswordRequest:
      properties:
        email:
          type: string
      required:
        - email
      type: object
    http.LoginRequest:
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
      type: object
    http.LogoutRequest:
      properties:
        revoke_all_sessions:
          type: boolean
      type: object
    http.RefreshTokenRequest:
      properties:
        refresh_token:
          type: string
      required:
        - refresh_token
      type: object
    http.RegisterRequest:
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        password:
          minLength: 8
          type: string
      required:
        - email
        - first_name
        - last_name
        - password
      type: object
    http.ResetPasswordRequest:
      properties:
        new_password:
          minLength: 8
          type: string
        reset_token:
          type: string
      required:
        - new_password
        - reset_token
      type: object
    http.UpdateForeignCompanyRequest:
      properties:
        address:
          type: string
        country_code:
          type: string
        full_name:
          type: string
        pin:
          type: string
      required:
        - country_code
        - full_name
        - pin
      type: object
    http.UpdateProfileRequest:
      properties:
        first_name:
          maxLength: 100
          minLength: 1
          type: string
        last_name:
          maxLength: 100
          minLength: 1
          type: string
        user_id:
          type: string
      required:
        - user_id
      type: object
    models.APIError:
      properties:
        code:
          type: string
        details:
          type: string
        message:
          type: string
      type: object
    models.APIResponse:
      properties:
        data: {}
        error:
          $ref: "#/components/schemas/models.APIError"
        meta:
          $ref: "#/components/schemas/models.MetaData"
        success:
          type: boolean
      type: object
    models.AuthResponse:
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_expires_in:
          type: integer
        refresh_token:
          type: string
        timestamp:
          type: integer
        token_type:
          type: string
        user:
          $ref: "#/components/schemas/models.User"
      type: object
    models.BankAccount:
      properties:
        account_number:
          type: string
        bank_code:
          type: string
        bank_name:
          type: string
        created_at:
          type: integer
        currency:
          type: string
        id:
          type: string
        is_active:
          type: boolean
        owner_id:
          type: string
        updated_at:
          type: integer
      type: object
    models.Catalog:
      properties:
        category:
          type: string
        created_at:
          type: integer
        currency:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        price:
          type: number
        unit:
          type: string
        updated_at:
          type: integer
      type: object
    models.Company:
      properties:
        created_at:
          type: integer
        description:
          type: string
        id:
          type: string
        member_count:
          type: integer
        name:
          type: string
        owner_id:
          type: string
        status:
          type: string
        updated_at:
          type: integer
      type: object
    models.Document:
      properties:
        assigned_to:
          type: string
        content:
          type: string
        created_at:
          type: integer
        created_by:
          type: string
        entries:
          items:
            $ref: "#/components/schemas/models.DocumentEntry"
          type: array
        id:
          type: string
        organization_id:
          type: string
        status:
          type: string
        status_changed_at:
          type: integer
        title:
          type: string
        updated_at:
          type: integer
        version:
          type: integer
      type: object
    models.DocumentEntry:
      properties:
        created_at:
          type: integer
        document_id:
          type: string
        id:
          type: string
        key:
          type: string
        updated_at:
          type: integer
        value:
          type: string
      type: object
    models.DocumentListResponse:
      properties:
        documents:
          items:
            $ref: "#/components/schemas/models.Document"
          type: array
        page_info:
          $ref: "#/components/schemas/models.PageInfo"
      type: object
    models.ForeignCompany:
      properties:
        address:
          type: string
        country_code:
          type: string
        created_at:
          type: integer
        full_name:
          type: string
        id:
          type: integer
        pin:
          type: string
        updated_at:
          type: integer
      type: object
    models.Invoice:
      properties:
        created_at:
          type: integer
        delivery_date:
          type: string
        id:
          type: string
        invoice_date:
          type: string
        invoice_number:
          type: string
        is_resident:
          type: boolean
        note:
          type: string
        status:
          type: string
        total_amount:
          type: number
        updated_at:
          type: integer
      type: object
    models.ListUsersResponse:
      properties:
        page_info:
          $ref: "#/components/schemas/models.PageInfo"
        users:
          items:
            $ref: "#/components/schemas/models.User"
          type: array
      type: object
    models.MetaData:
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer
      type: object
    models.PageInfo:
      properties:
        page:
          type: integer
        size:
          type: integer
        total_count:
          type: integer
      type: object
    models.TokenResponse:
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_expires_in:
          type: integer
        refresh_token:
          type: string
        timestamp:
          type: integer
        token_type:
          type: string
      type: object
    models.User:
      properties:
        created_at:
          type: integer
        email:
          type: string
        first_name:
          type: string
        is_active:
          type: boolean
        last_name:
          type: string
        role:
          type: string
        status:
          type: string
        updated_at:
          type: integer
        user_id:
          type: string
      type: object
