worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  # Performance optimization
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  # Keepalive optimization for upstream connections
  keepalive_timeout 65s;
  keepalive_requests 100;

  # Hash table optimization
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 20M;

  # Open file cache to reduce system calls
  open_file_cache max=10000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # Gzip compression (optimized for speed)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript
  application/json application/javascript application/xml+rss
  application/rss+xml font/truetype font/opentype
  application/vnd.ms-fontobject image/svg+xml;
  gzip_disable "msie6";

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/s;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=5000r/s;

  # Upstream backend
  upstream api_gateway {
    least_conn;
    server api-gateway:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # Upstream frontend
  upstream kkm_platform {
    least_conn;
    server kkm-platform:4000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # Redirect HTTP to HTTPS (when SSL is enabled)
  # server {
  #     listen 80;
  #     server_name _;
  #     return 301 https://$host$request_uri;
  # }

  # HTTP Server (development/testing)
  server {
    listen 80;
    server_name _;

    # Global CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Health check endpoint
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Nginx metrics endpoint for prometheus exporter
    location /nginx_status {
      stub_status on;
      access_log off;
      allow 127.0.0.1;
      allow 172.0.0.0/8; # Docker internal network
      deny all;
    }

    # Metrics endpoint (restricted)
    location /metrics {
      access_log off;
      allow 127.0.0.1;
      allow 172.0.0.0/8; # Docker network
      deny all;
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # Next.js static files with caching (высокий приоритет)
    location /_next/static/ {
      proxy_pass http://kkm_platform;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Next.js public files
    location /public/ {
      proxy_pass http://kkm_platform;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      expires 1d;
      add_header Cache-Control "public";
    }

    # Next.js favicon and root assets
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
      proxy_pass http://kkm_platform;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    # API routes - proxy to API Gateway
    location /api/ {
      # Handle OPTIONS preflight
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
        add_header Access-Control-Max-Age 1728000 always;
        add_header Content-Length 0 always;
        add_header Content-Type text/plain always;
        return 204;
      }

      limit_req zone=api_limit burst=50 nodelay;

      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";

      # Optimized timeouts
      proxy_connect_timeout 20s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_buffering off;

      # Optimized buffers
      proxy_buffer_size 8k;
      proxy_buffers 16 8k;
      proxy_busy_buffers_size 16k;

      # Error handling
      proxy_intercept_errors on;
      error_page 502 503 504 /50x.html;
    }

    # Swagger UI routes - proxy to API Gateway
    location ~ ^/(swagger|docs|redoc) {
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
    }

    # Proxy all other traffic to Next.js frontend
    location / {
      # Handle OPTIONS preflight
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With' always;
        add_header Access-Control-Max-Age 1728000 always;
        add_header Content-Length 0 always;
        add_header Content-Type text/plain always;
        return 204;
      }

      limit_req zone=general_limit burst=20 nodelay;

      proxy_pass http://kkm_platform;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Optimized timeouts for Next.js
      proxy_connect_timeout 20s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_buffering off;

      # Optimized buffers
      proxy_buffer_size 8k;
      proxy_buffers 16 8k;
      proxy_busy_buffers_size 16k;

      # Error handling
      proxy_intercept_errors on;
      error_page 502 503 504 /50x.html;
    }

    # Error pages
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }

  # HTTPS Server (enabled for production)
  server {
    listen 443 ssl http2;
    server_name _;

    # SSL certificates
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js static files with caching (высокий приоритет)
    location /_next/static/ {
      proxy_pass http://kkm_platform;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Next.js public files
    location /public/ {
      proxy_pass http://kkm_platform;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      expires 1d;
      add_header Cache-Control "public";
    }

    # Next.js favicon and root assets
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
      proxy_pass http://kkm_platform;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    # API routes - proxy to API Gateway
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;

      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";

      # Optimized timeouts
      proxy_connect_timeout 20s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_buffering off;

      # Optimized buffers
      proxy_buffer_size 8k;
      proxy_buffers 16 8k;
      proxy_busy_buffers_size 16k;

      # Error handling
      proxy_intercept_errors on;
      error_page 502 503 504 /50x.html;
    }

    # Swagger UI routes - proxy to API Gateway
    location ~ ^/(swagger|docs|redoc) {
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
    }

    # Proxy all other traffic to Next.js frontend
    location / {
      limit_req zone=general_limit burst=20 nodelay;

      proxy_pass http://kkm_platform;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Optimized timeouts for Next.js
      proxy_connect_timeout 20s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_buffering off;

      # Optimized buffers
      proxy_buffer_size 8k;
      proxy_buffers 16 8k;
      proxy_busy_buffers_size 16k;

      # Error handling
      proxy_intercept_errors on;
      error_page 502 503 504 /50x.html;
    }

    # Error pages
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
