syntax = "proto3";

package api.document;

option go_package = "github.com/rusgainew/kkm-project-mks/proto-lib/document";

import "legacy/common.proto";
import "legacy/document.proto";

/**
 * DocumentService предоставляет операции управления документами и workflow.
 * Используется:
 * - document-service: реализует этот сервис
 * - api-gateway: клиент для маршрутизации запросов
 */
service DocumentService {
  /**
   * Получение документа по ID.
   * Запрос: document_id
   * Ответ: документ со всеми записями
   */
  rpc GetDocument(GetDocumentRequest) returns (Document);

  /**
   * Создание нового документа.
   * Запрос: organization_id, title, content, created_by
   * Ответ: document
   * Генерирует событие: DocumentCreatedEvent (через RabbitMQ)
   */
  rpc CreateDocument(CreateDocumentRequest) returns (Document);

  /**
   * Обновление документа.
   * Запрос: id, title, content
   * Ответ: document
   * Генерирует событие: DocumentUpdatedEvent (через RabbitMQ)
   */
  rpc UpdateDocument(UpdateDocumentRequest) returns (Document);

  /**
   * Отправка документа на согласование.
   * Запрос: document_id, recipient_id, message
   * Ответ: document
   * Генерирует событие: DocumentSentEvent (через RabbitMQ)
   */
  rpc SendDocument(SendDocumentRequest) returns (Document);

  /**
   * Одобрение документа.
   * Запрос: document_id, approved_by, comments
   * Ответ: document
   * Генерирует событие: DocumentApprovedEvent (через RabbitMQ)
   */
  rpc ApproveDocument(ApproveDocumentRequest) returns (Document);

  /**
   * Отклонение документа.
   * Запрос: document_id, rejected_by, reason
   * Ответ: document
   * Генерирует событие: DocumentRejectedEvent (через RabbitMQ)
   */
  rpc RejectDocument(RejectDocumentRequest) returns (Document);

  /**
   * Архивирование документа.
   * Запрос: document_id
   * Ответ: document
   * Генерирует событие: DocumentArchivedEvent (через RabbitMQ)
   */
  rpc ArchiveDocument(ArchiveDocumentRequest) returns (Document);

  /**
   * Список документов с пагинацией и фильтрами.
   * Запрос: organization_id, status, page, per_page
   * Ответ: список документов с информацией о пагинации
   */
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);

  /**
   * Добавление записи в документ.
   * Запрос: document_id, key, value
   * Ответ: document_entry
   */
  rpc AddDocumentEntry(AddDocumentEntryRequest) returns (DocumentEntry);

  /**
   * Обновление записи документа.
   * Запрос: entry_id, key, value
   * Ответ: document_entry
   */
  rpc UpdateDocumentEntry(UpdateDocumentEntryRequest) returns (DocumentEntry);

  /**
   * Удаление записи документа.
   * Запрос: entry_id
   * Ответ: empty
   */
  rpc RemoveDocumentEntry(RemoveDocumentEntryRequest) returns (api.common.Empty);

  /**
   * Получение истории документа.
   * Запрос: document_id, page, per_page
   * Ответ: версии документа
   */
  rpc GetDocumentHistory(GetDocumentHistoryRequest) returns (DocumentHistoryResponse);
}

// ============================================
// Сообщения запросов и ответов
// ============================================

message GetDocumentRequest {
  string document_id = 1;
}

message CreateDocumentRequest {
  string organization_id = 1;
  string title = 2;
  string content = 3;
  string created_by = 4;
}

message UpdateDocumentRequest {
  string id = 1;
  string title = 2;
  string content = 3;
}

message SendDocumentRequest {
  string document_id = 1;
  string recipient_id = 2;
  string message = 3;
}

message ApproveDocumentRequest {
  string document_id = 1;
  string approved_by = 2;
  string comments = 3;
}

message RejectDocumentRequest {
  string document_id = 1;
  string rejected_by = 2;
  string reason = 3;
}

message ArchiveDocumentRequest {
  string document_id = 1;
}

message ListDocumentsRequest {
  string organization_id = 1;
  string status = 2; // Фильтр: "draft" (черновик), "sent" (отправлен), "approved" (одобрен), "archived" (архивирован)
  string created_by = 3; // Фильтр по создателю (опционально)
  int32 page = 4;
  int32 per_page = 5;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  api.common.PageInfo page_info = 2;
}

message AddDocumentEntryRequest {
  string document_id = 1;
  string key = 2;
  string value = 3;
}

message UpdateDocumentEntryRequest {
  string entry_id = 1;
  string key = 2;
  string value = 3;
}

message RemoveDocumentEntryRequest {
  string entry_id = 1;
}

message GetDocumentHistoryRequest {
  string document_id = 1;
  int32 page = 2;
  int32 per_page = 3;
}

message DocumentHistoryResponse {
  repeated DocumentVersion versions = 1;
  api.common.PageInfo page_info = 2;
}
