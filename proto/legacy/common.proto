syntax = "proto3";

package api.common;

option go_package = "github.com/rusgainew/kkm-project-mks/proto-lib/common";

/**
 * Пустое сообщение для операций, которые не возвращают данные.
 * Используется RPC методами, которые возвращают только статус.
 */
message Empty {}

/**
 * Информация об ошибке.
 * Возвращается при неудачном выполнении RPC операций.
 */
message Error {
  // HTTP-подобный код ошибки
  int32 code = 1;
  // Сообщение об ошибке
  string message = 2;
  // Дополнительные детали ошибки
  string details = 3;
  // ID трассировки ошибки для отладки
  string trace_id = 4;
}

/**
 * Информация о пагинации.
 * Используется в ответах со списками.
 */
message PageInfo {
  // Номер текущей страницы (нумерация с 1)
  int32 page = 1;
  // Количество элементов на странице
  int32 per_page = 2;
  // Общее количество элементов
  int64 total = 3;
  // Общее количество страниц
  int32 total_pages = 4;
}

/**
 * Временная метка с опциональным часовым поясом.
 */
message Timestamp {
  // Unix временная метка в секундах
  int64 seconds = 1;
  // Наносекунды для точности
  int32 nanos = 2;
  // Временная метка в формате ISO 8601
  string iso_string = 3;
}
