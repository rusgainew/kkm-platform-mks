apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

commonLabels:
  app.kubernetes.io/name: api-gateway
  app.kubernetes.io/version: v1

resources:
  - deployment.yaml
  - config.yaml
  - ingress.yaml

replicas:
  - name: api-gateway
    count: 3

images:
  - name: ghcr.io/rusgainew/kkm-project-mks/api-gateway
    newTag: latest

configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    envs:
      - config.env

patches:
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: HTTP_PORT
            value: "8080"
          - name: METRICS_PORT
            value: "9090"
          - name: LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: api-gateway-config
                key: LOG_LEVEL
