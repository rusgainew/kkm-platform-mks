services:
  # ===================================
  # Infrastructure Services
  # ===================================

  # PostgreSQL databases - one per command service (database per service pattern)

  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: user_pass_2026
      POSTGRES_DB: user_db
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_svc -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkm-network

  postgres-company:
    image: postgres:15-alpine
    container_name: postgres-company
    restart: unless-stopped
    environment:
      POSTGRES_USER: company_svc
      POSTGRES_PASSWORD: company_pass_2026
      POSTGRES_DB: company_db
    volumes:
      - postgres_company_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_svc -d company_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkm-network

  postgres-catalog:
    image: postgres:15-alpine
    container_name: postgres-catalog
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog_svc
      POSTGRES_PASSWORD: catalog_pass_2026
      POSTGRES_DB: catalog_db
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_svc -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkm-network

  postgres-invoice:
    image: postgres:15-alpine
    container_name: postgres-invoice
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice_svc
      POSTGRES_PASSWORD: invoice_pass_2026
      POSTGRES_DB: invoice_db
    volumes:
      - postgres_invoice_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_svc -d invoice_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkm-network

  postgres-bank-account:
    image: postgres:15-alpine
    container_name: postgres-bank-account
    restart: unless-stopped
    environment:
      POSTGRES_USER: bank_svc
      POSTGRES_PASSWORD: bank_pass_2026
      POSTGRES_DB: bank_account_db
    volumes:
      - postgres_bank_account_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_svc -d bank_account_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkm-network

  postgres-foreign-company:
    image: postgres:15-alpine
    container_name: postgres-foreign-company
    restart: unless-stopped
    environment:
      POSTGRES_USER: foreign_svc
      POSTGRES_PASSWORD: foreign_pass_2026
      POSTGRES_DB: foreign_company_db
    volumes:
      - postgres_foreign_company_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreign_svc -d foreign_company_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkm-network

  postgres-document:
    image: postgres:15-alpine
    container_name: postgres-document
    restart: unless-stopped
    environment:
      POSTGRES_USER: document_svc
      POSTGRES_PASSWORD: document_pass_2026
      POSTGRES_DB: document_db
    volumes:
      - postgres_document_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_svc -d document_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkm-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - kkm-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: kkm_user
      RABBITMQ_DEFAULT_PASS: kkm_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - kkm-network

  # ===================================
  # Command Services (Write)
  # ===================================

  user-server:
    build:
      context: .
      dockerfile: services/user-server/Dockerfile
    container_name: user-server
    restart: unless-stopped
    environment:
      USER_SERVER_DB_DRIVER: postgres
      USER_SERVER_DB_URL: postgres://user_svc:user_pass_2026@postgres-user:5432/user_db?sslmode=disable
      USER_SERVER_JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
      USER_SERVER_PORT: 50051
      USER_SERVER_METRICS_PORT: 9101
      USER_SERVER_ADMIN_EMAIL: "admin@example.com"
      USER_SERVER_ADMIN_PASSWORD: "Admin@2024Sec#secure99"
      USER_SERVER_ADMIN_FIRST_NAME: "Admin"
      USER_SERVER_ADMIN_LAST_NAME: "User"
      USER_SERVER_RABBITMQ_ENABLED: "true"
      USER_SERVER_RABBITMQ_URL: "amqp://kkm_user:kkm_password@rabbitmq:5672/"
    depends_on:
      postgres-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kkm-network
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 10s
      retries: 3

  company-server:
    build:
      context: .
      dockerfile: services/company-server/Dockerfile
    container_name: company-server
    restart: unless-stopped
    environment:
      DB_HOST: postgres-company
      DB_PORT: 5432
      DB_USER: company_svc
      DB_PASSWORD: company_pass_2026
      DB_NAME: company_db
      DB_SSLMODE: disable
      GRPC_PORT: 50052
      METRICS_PORT: 9103
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
      RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
    depends_on:
      postgres-company:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9103/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - kkm-network

  catalog-server:
    build:
      context: .
      dockerfile: services/catalog-server/Dockerfile
    container_name: catalog-server
    restart: unless-stopped
    environment:
      CATALOG_SERVER_DB_URL: postgres://catalog_svc:catalog_pass_2026@postgres-catalog:5432/catalog_db?sslmode=disable
      CATALOG_SERVER_PORT: 50053
      CATALOG_SERVER_METRICS_PORT: 9105
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
      CATALOG_SERVER_RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
    depends_on:
      postgres-catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kkm-network

  invoice-server:
    build:
      context: .
      dockerfile: services/invoice-server/Dockerfile
      args:
        - GOPROXY=direct
        - GOSUMDB=off
    container_name: invoice-server
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      DB_HOST: postgres-invoice
      DB_PORT: 5432
      DB_USER: invoice_svc
      DB_PASSWORD: invoice_pass_2026
      DB_NAME: invoice_db
      DB_SSLMODE: disable
      GRPC_PORT: 50054
      METRICS_PORT: 9107
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
      RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
    depends_on:
      postgres-invoice:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kkm-network

  bank-account-server:
    build:
      context: .
      dockerfile: services/bank-account-server/Dockerfile
    container_name: bank-account-server
    restart: unless-stopped
    environment:
      BANK_ACCOUNT_SERVER_DB_URL: postgres://bank_svc:bank_pass_2026@postgres-bank-account:5432/bank_account_db?sslmode=disable
      BANK_ACCOUNT_SERVER_PORT: 50055
      BANK_ACCOUNT_SERVER_METRICS_PORT: 9109
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
      BANK_ACCOUNT_SERVER_RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
    depends_on:
      postgres-bank-account:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kkm-network

  foreign-company-server:
    build:
      context: .
      dockerfile: services/foreign-company-server/Dockerfile
    container_name: foreign-company-server
    restart: unless-stopped
    environment:
      FOREIGN_COMPANY_SERVER_DB_URL: postgres://foreign_svc:foreign_pass_2026@postgres-foreign-company:5432/foreign_company_db?sslmode=disable
      FOREIGN_COMPANY_SERVER_PORT: 50056
      FOREIGN_COMPANY_SERVER_METRICS_PORT: 9111
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
      FOREIGN_COMPANY_SERVER_RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
    depends_on:
      postgres-foreign-company:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9111/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - kkm-network

  document-server:
    build:
      context: .
      dockerfile: services/document-server/Dockerfile
    container_name: document-server
    restart: unless-stopped
    environment:
      DB_HOST: postgres-document
      DB_PORT: 5432
      DB_USER: document_svc
      DB_PASSWORD: document_pass_2026
      DB_NAME: document_db
      DB_SSLMODE: disable
      SERVER_PORT: 50057
      METRICS_PORT: 9113
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
      RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
    depends_on:
      postgres-document:
        condition: service_healthy
    networks:
      - kkm-network

  # ===================================
  # Query Services (Read - CQRS)
  # ===================================

  user-query-server:
    build:
      context: .
      dockerfile: services/user-query-server/Dockerfile
    container_name: user-query-server
    restart: unless-stopped
    environment:
      USER_QUERY_DATABASE_URL: postgres://user_svc:user_pass_2026@postgres-user:5432/user_db?sslmode=disable
      USER_QUERY_REDIS_URL: redis://redis:6379/0
      USER_QUERY_RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
      GRPC_PORT: 50061
      METRICS_PORT: 9102
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kkm-network

  catalog-query-server:
    build:
      context: .
      dockerfile: services/catalog-query-server/Dockerfile
    container_name: catalog-query-server
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
      GRPC_PORT: 50063
      METRICS_PORT: 9106
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kkm-network

  invoice-query-server:
    build:
      context: .
      dockerfile: services/invoice-query-server/Dockerfile
    container_name: invoice-query-server
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/3
      RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
      GRPC_PORT: 50064
      METRICS_PORT: 9108
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kkm-network

  bank-account-query-server:
    build:
      context: .
      dockerfile: services/bank-account-query-server/Dockerfile
    container_name: bank-account-query-server
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
      GRPC_PORT: 50065
      METRICS_PORT: 9110
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kkm-network

  foreign-company-query-server:
    build:
      context: .
      dockerfile: services/foreign-company-query-server/Dockerfile
    container_name: foreign-company-query-server
    environment:
      REDIS_URL: redis://redis:6379/4
      RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
      GRPC_PORT: 50066
      METRICS_PORT: 9112
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kkm-network

  document-query-server:
    build:
      context: .
      dockerfile: services/document-query-server/Dockerfile
    container_name: document-query-server
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/5
      RABBITMQ_URL: amqp://kkm_user:kkm_password@rabbitmq:5672/
      GRPC_PORT: 50067
      METRICS_PORT: 9114
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kkm-network

  analytics-server:
    build:
      context: .
      dockerfile: services/analytics-server/Dockerfile
    container_name: analytics-server
    restart: unless-stopped
    environment:
      GRPC_PORT: 50070
      METRICS_PORT: 9115
      DB_HOST: postgres-invoice
      DB_PORT: 5432
      DB_USER: invoice_svc
      DB_PASSWORD: invoice_pass_2026
      DB_NAME: invoice_db
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_DB: 6
      REDIS_TTL: 300
      LOG_LEVEL: info
      ENABLE_METRICS: "true"
    depends_on:
      postgres-invoice:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kkm-network

  # ===================================
  # API Gateway
  # ===================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080
      GRPC_PORT: 9090
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters-long"
      USER_SERVICE_URL: user-server:50051
      USER_QUERY_SERVICE_URL: user-query-server:50061
      COMPANY_SERVICE_URL: company-server:50052
      CATALOG_SERVICE_URL: catalog-server:50053
      CATALOG_QUERY_SERVICE_URL: catalog-query-server:50063
      INVOICE_SERVICE_URL: invoice-server:50054
      INVOICE_QUERY_SERVICE_URL: invoice-query-server:50064
      BANK_ACCOUNT_SERVICE_URL: bank-account-server:50055
      BANK_ACCOUNT_QUERY_SERVICE_URL: bank-account-query-server:50065
      FOREIGN_COMPANY_SERVICE_URL: foreign-company-server:50056
      # FOREIGN_COMPANY_QUERY_SERVICE_URL: foreign-company-query-server:50066
      DOCUMENT_SERVICE_URL: document-server:50057
      DOCUMENT_QUERY_SERVICE_URL: document-query-server:50067
      ANALYTICS_SERVICE_URL: analytics-server:50070
    depends_on:
      - user-server
      - user-query-server
      - company-server
      - catalog-server
      - catalog-query-server
      - invoice-server
      - invoice-query-server
      - bank-account-server
      - bank-account-query-server
      - foreign-company-server
      # - foreign-company-query-server
      - document-server
      - document-query-server
      - analytics-server
    networks:
      - kkm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================================
  # Nginx Reverse Proxy
  # ===================================

  nginx-proxy:
    build:
      context: .
      dockerfile: services/nginx-proxy/Dockerfile
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api-gateway:
        condition: service_healthy
      kkm-platform:
        condition: service_started
    networks:
      - kkm-network
    volumes:
      - ./services/nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx-proxy/certs:/etc/nginx/certs:Z
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  # ===================================
  # Frontend (Next.js)
  # ===================================

  kkm-platform:
    build:
      context: .
      dockerfile: kkm-platform/Dockerfile
    container_name: kkm-platform
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - kkm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================================
  # Monitoring & Observability
  # ===================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - kkm-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboard-overview.json:/var/lib/grafana/dashboards/overview.json:ro
      - ./monitoring/grafana-dashboard-detailed.json:/var/lib/grafana/dashboards/detailed.json:ro
      - ./monitoring/grafana-dashboard-nginx.json:/var/lib/grafana/dashboards/nginx.json:ro
    depends_on:
      - prometheus
    networks:
      - kkm-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - kkm-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:14269/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

# ===================================
# Networks
# ===================================

networks:
  kkm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ===================================
# Volumes
# ===================================
volumes:
  # PostgreSQL volumes - one per command service
  postgres_user_data:
    driver: local
  postgres_company_data:
    driver: local
  postgres_catalog_data:
    driver: local
  postgres_invoice_data:
    driver: local
  postgres_bank_account_data:
    driver: local
  postgres_foreign_company_data:
    driver: local
  postgres_document_data:
    driver: local

  # Other infrastructure volumes
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
